version: "2"

run:
  go: "1.26.1"
  timeout: 5m
  tests: true

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    golines:
      max-len: 120
linters:
  default: "all"
  disable:
    - cyclop
    - dogsled
    - embeddedstructfieldcheck
    - err113
    - funcorder
    - gocognit
    - goconst
    - gocyclo
    - godoclint
    - gomodguard
    - inamedparam
    - interfacebloat
    - ireturn
    - lll
    - makezero
    - maintidx
    - nestif
    - noinlineerr
    - nonamedreturns
    - mnd
    - musttag
    - nlreturn
    - perfsprint
    - testpackage
    - varnamelen
    - wsl
    - wsl_v5
  exclusions:
    presets:
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gosec
          - noctx
          - wrapcheck
      - path: wasm/
        linters:
          # No matter what we do, we can't seem to satisfy any of those for wasm files.
          # And it's not like they are the most important linters anyway.
          - gci
          - gofumpt
          - goimports
  settings:
    # Direct imports only. `test/deps_test.go` pins the transitive closure.
    depguard:
      rules:
        lib:
          files:
            - "**/lib/*.go"
          list-mode: strict
          allow:
            - $gostd
            - "golang.org/x/sys/unix"
            - "golang.org/x/sync/errgroup"
            - "golang.org/x/crypto/argon2"
            - "golang.org/x/crypto/chacha20poly1305"
        http:
          files:
            - "**/http/*.go"
          list-mode: strict
          allow:
            - $gostd
            - "github.com/cling-com/cling-sync/lib"
        workspace:
          files:
            - "**/workspace/*.go"
          list-mode: strict
          allow:
            - $gostd
            - "github.com/cling-com/cling-sync/lib"
            - "github.com/cling-com/cling-sync/http"
        keychain:
          files:
            - "**/keychain/*.go"
          list-mode: strict
          allow:
            - $gostd
            - "github.com/cling-com/cling-sync/lib"
        cli:
          files:
            - "**/cmd/cling-sync/*.go"
          list-mode: strict
          allow:
            - $gostd
            - "golang.org/x/term"
            - "github.com/cling-com/cling-sync/lib"
            - "github.com/cling-com/cling-sync/http"
            - "github.com/cling-com/cling-sync/workspace"
            - "github.com/cling-com/cling-sync/keychain"
        wasm:
          files:
            - "**/wasm/*.go"
          list-mode: strict
          allow:
            - $gostd
            - "github.com/cling-com/cling-sync/lib"
            - "github.com/cling-com/cling-sync/http"
            - "github.com/cling-com/cling-sync/workspace"
        wasm-cmd:
          files:
            - "**/wasm/cmd/*.go"
          list-mode: strict
          allow:
            - $gostd
            - "github.com/cling-com/cling-sync/wasm"
        wasm-testharness:
          files:
            - "**/wasm/internal/wasmtest/*.go"
          list-mode: strict
          allow:
            - $gostd
            - "github.com/cling-com/cling-sync/lib"
            - "github.com/cling-com/cling-sync/http"
            - "github.com/cling-com/cling-sync/workspace"
            - "github.com/cling-com/cling-sync/wasm"
        wasm-checks:
          files:
            - "**/wasm/internal/checkrepo/*.go"
            - "**/wasm/internal/checkhttp/*.go"
          list-mode: strict
          allow:
            - $gostd
            - "github.com/cling-com/cling-sync/wasm"
            - "github.com/cling-com/cling-sync/wasm/internal/wasmtest"
        test:
          files:
            - "**/test/*.go"
          list-mode: strict
          allow:
            - $gostd
            - "github.com/cling-com/cling-sync/lib"
    forbidigo:
      forbid:
        - pattern: '^os\.'
          msg: "Prefer io/fs over os"
    funlen:
      lines: 60
      statements: 60
    godox:
      keywords:
        - fixme
    govet:
      disable:
        - composites
    revive:
      enable-all-rules: false
      rules:
        - name: exported
          disabled: true
    wrapcheck:
      extra-ignore-sigs:
        - .WrapErrorf
